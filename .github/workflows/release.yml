# Build the RyzikOS ISO on every push to main and publish it as the latest
# GitHub release. The website's download button always points at it, and
# Settings > Update in RyzikOS downloads kernel.gz and version.txt from it.
name: Release ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang grub-pc-bin grub-common xorriso mtools

      - name: Install Rust
        # rustup reads rust-toolchain.toml and adds the x86_64-unknown-none target
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            kernel/target
          key: cargo-${{ hashFiles('kernel/Cargo.lock') }}

      - name: Build
        # the build number goes into the kernel and the disc's GRUB menu;
        # Telegram's api_id and api_hash, when the repository has them as
        # secrets, let people log in without getting their own
        env:
          RYZIKOS_TG_API_ID: ${{ secrets.RYZIKOS_TG_API_ID }}
          RYZIKOS_TG_API_HASH: ${{ secrets.RYZIKOS_TG_API_HASH }}
        run: make RYZIKOS_BUILD=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.0.${{ github.run_number }}"
          cp build/everos.iso "ryzikos-${version}.iso"
          sha256sum "ryzikos-${version}.iso" > "ryzikos-${version}.iso.sha256"
          # for Settings > Update: the kernel (GRUB unpacks gzip) and
          # "<build> <sha256 of kernel.gz>"
          gzip -9 -n -c build/kernel.bin > kernel.gz
          echo "${{ github.run_number }} $(sha256sum kernel.gz | cut -d' ' -f1)" > version.txt
          gh release create "v${version}" "ryzikos-${version}.iso" "ryzikos-${version}.iso.sha256" \
            kernel.gz version.txt scripts/run-windows.bat scripts/ryzikos-clipboard.ps1 \
            --title "RyzikOS ${version}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
