[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# The ASM boot code identity-maps low memory and links the kernel at 1 MiB,
# so use the small code model instead of the target's higher-half default.
# The crypto crates (for HTTPS) would use SSE and AES-NI, which the
# kernel does not enable, so make them use their plain Rust versions
# (the VPN's ChaCha20-Poly1305 and X25519 too).
rustflags = ["-C", "code-model=small", "-C", "relocation-model=static", "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft", "--cfg", "poly1305_force_soft", "--cfg", "chacha20_force_soft", "--cfg", 'curve25519_dalek_backend="serial"']
