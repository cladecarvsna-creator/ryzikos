[package]
name = "everos-kernel"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Each crate as one optimisation unit, so the drawing code in the big
# gui module gets inlined across files. (LTO across crates would need
# the standard library built with the kernel's small code model.)
codegen-units = 1

[dependencies]
linked_list_allocator = "0.10"
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dns", "socket-dhcpv4"] }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
ab_glyph = { version = "0.2.32", default-features = false, features = ["libm"] }
zune-png = { version = "0.5.2", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }
zune-core = { version = "0.5.3", default-features = false }
libm = "0.2"
aes = "0.8"
sha1 = { version = "0.10", default-features = false, features = ["force-soft"] }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
zune-inflate = { version = "0.2", default-features = false, features = ["gzip"] }
qrcodegen-no-heap = "1.8"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "arithmetic"] }
chacha20poly1305 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
md-5 = { version = "0.10", default-features = false, features = ["force-soft"] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# H.264 for the Video Player, vendored for one no_std fix (see its VENDORED.md)
rusty_h264-decoder = { path = "vendor/rusty_h264-decoder", default-features = false, features = ["libm"] }
rusty_h264-common = { version = "0.16", default-features = false }

[build-dependencies]
cc = "1"
