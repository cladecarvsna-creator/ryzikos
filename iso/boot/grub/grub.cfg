set timeout=0
set default=0

# video drivers, so GRUB can set the framebuffer mode the kernel asks for
insmod all_video

# The build number of this disc's kernel; make fills it in, 0 for a
# build made from source.
set iso_build=@BUILD@
set disc=$root

# Settings > Update saves a newer kernel on the system disk, with its
# build number in update.env. Boot it when it is newer than the disc's.
# Esc during the one second wait shows the menu, to start the disc's
# own kernel instead.
if [ "$iso_build" != 0 ]; then
    insmod part_msdos
    insmod part_gpt
    insmod fat
    if search --no-floppy --set=upd --file '/$Update/update.env'; then
        if load_env --file "($upd)/\$Update/update.env" upd_build; then
            if [ "$upd_build" -gt "$iso_build" ]; then
                set default=1
                set fallback=0
                set timeout_style=hidden
                set timeout=1
            fi
        fi
    fi
fi

menuentry "RyzikOS 1.0.$iso_build" {
    multiboot2 ($disc)/boot/kernel.bin
    boot
}

menuentry "RyzikOS 1.0.$upd_build (update)" {
    multiboot2 "($upd)/\$Update/kernel.gz"
    boot
}
