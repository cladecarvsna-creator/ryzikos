# The live CD's menu. RyzikOS runs from the disc with its files in
# memory; "Install RyzikOS" on its desktop puts it on a hard disk (see
# kernel/src/install.rs). GRUB also loads the files the installer
# copies, so it works from a USB stick, which RyzikOS can't read.
set timeout=0
set default=0

# video drivers, so GRUB can set the framebuffer mode the kernel asks for
insmod all_video

# The build number of this disc's kernel; make fills it in, 0 for a
# build made from source.
set iso_build=@BUILD@

# RyzikOS installed on a hard disk starts from there, so leaving the
# disc in the drive after installing still starts the installed system.
# Only the first partition of each disk is looked at: `search` probes
# every device and took most of the boot time.
insmod part_msdos
insmod fat
for d in hd0 hd1 hd2 hd3; do
    if [ -z "$installed" -a -f ($d,msdos1)/boot/ryzikos-installed.txt ]; then
        set installed=($d,msdos1)
        set default=1
        set timeout=4
    fi
done

menuentry "RyzikOS 1.0.$iso_build Live CD" {
    multiboot2 /boot/kernel.gz live
    # --nounzip: the installer copies kernel.gz as it is, so GRUB doesn't
    # unpack the whole kernel a second time (seconds on a slow machine)
    module2 --nounzip /boot/kernel.gz kernel.gz
    module2 /boot/grub/ryzikos/boot.img boot.img
    module2 /boot/grub/ryzikos/core.img core.img
    boot
}

if [ -n "$installed" ]; then
    menuentry "RyzikOS on the hard disk" {
        set root=$installed
        configfile /boot/grub/grub.cfg
    }
fi
